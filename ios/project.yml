name: PaintByNumbers
options:
  bundleIdPrefix: com.pbn
  deploymentTarget:
    iOS: "17.5"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: NO
packages:
  PaintEngine:
    path: PaintEngine
targets:
  PaintByNumbers:
    type: application
    platform: iOS
    sources:
      - path: PaintByNumbers
    dependencies:
      - package: PaintEngine
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pbn.paintbynumbers
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UIColorName: PaperColor
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "2"
        SUPPORTS_MACCATALYST: NO
    info:
      path: PaintByNumbers/Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSPhotoLibraryAddUsageDescription: "Сохранение готовых картин в вашу фотобиблиотеку."
        UIRequiresFullScreen: true
  PaintByNumbersTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PaintByNumbersTests
    dependencies:
      - target: PaintByNumbers
